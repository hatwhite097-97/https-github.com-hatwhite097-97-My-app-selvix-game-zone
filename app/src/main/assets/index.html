<!DOCTYPE html>
<html lang="sw" class="bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selvix Game Zone</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111827">
  
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="./css/style.css" rel="stylesheet">
</head>
<body class="min-h-screen text-gray-200">

  <div id="app-root" class="max-w-md mx-auto min-h-screen relative shadow-2xl border-x border-gray-900 bg-gray-950">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
  
  <script src="./js/database.js"></script>
  <script src="./js/appwrite-client.js"></script>
  <script src="./js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registered successfully!', reg.scope))
          .catch(err => console.warn('Service Worker registration failed: ', err));
      });
    }
  </script>
</body>
</html>
